[supervisord]
nodaemon=true

[program:octane]
command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000
directory=/var/www
autostart=true
autorestart=true

[program:migrate]
command=php artisan migrate --force
directory=/var/www
autostart=true
autorestart=false
startsecs=0
exitcodes=0

[program:database_seeder]
command=php artisan db:seed --force
directory=/var/www
autostart=true
autorestart=false
startsecs=0
exitcodes=0

